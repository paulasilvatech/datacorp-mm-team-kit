name: CI

on:
  push:
    branches: [ main, develop, "spec/**", "impl/**" ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'pom.xml'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            infra:
              - 'infra/**'
              - '**/*.tf'

  backend:
    name: Backend (Java 21 + Spring Boot)
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: |
          set -euo pipefail
          ./mvnw -B verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend (Next.js 15 + TypeScript)
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
      - name: Set up Node 20
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
      - name: Lint
        run: |
          set -euo pipefail
          pnpm lint
      - name: Type-check
        run: |
          set -euo pipefail
          pnpm typecheck
      - name: Test
        run: |
          set -euo pipefail
          pnpm test --run --coverage

  infra:
    name: Infra (Terraform)
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: infra
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          # Must be >= the version that last wrote the state file. Terraform state
          # is forward-only: 1.9.5 cannot read state written by 1.14.6, so CI would
          # fail on any command that loads state.
          terraform_version: "1.14.6"
      - name: Format check
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
      - name: Validate
        run: |
          set -euo pipefail
          # `terraform validate` only ever looks at the CURRENT directory. Running it in infra/,
          # which holds no root .tf files, returned a vacuous "Success!" and validated nothing.
          # Walk every directory that actually declares Terraform and validate each one.
          shopt -s nullglob
          modules=$(find . -type f -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u)
          if [ -z "$modules" ]; then
            echo "No Terraform modules found under infra/" >&2
            exit 1
          fi
          for dir in $modules; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
