name: Validate Adabas/Natural Lab local deployment

# This workflow does NOT deploy the lab.
#
# The Microsoft corporate tenant used by this workshop applies a management-group Modify
# policy ("MCAPSGov Deploy and Modify Policies") that forces Storage Account
# publicNetworkAccess=Disabled. That makes an azurerm blob backend unreachable from
# GitHub-hosted runners. Local Terraform state is therefore the default and the facilitator's
# workstation is the only supported place to run apply/destroy because GitHub-hosted runners
# do not persist local state between runs.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Validation to run; apply/destroy are facilitator-local only"
        required: true
        default: preflight
        type: choice
        options: [preflight, plan]

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.14.6"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  LAB_DIR: infra/adabas-natural-lab

jobs:
  scan:
    name: Static Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive infra/

      - name: Validate every module without backend access
        run: |
          set -euo pipefail
          for dir in infra/*/; do
            [ -n "$(find "$dir" -maxdepth 1 -name '*.tf' -print -quit)" ] || continue
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -lockfile=readonly
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.63.1

      - name: Run tflint
        run: |
          set -euo pipefail
          tflint --init --config="${GITHUB_WORKSPACE}/infra/.tflint.hcl"
          for dir in infra/*/; do
            [ -n "$(find "$dir" -maxdepth 1 -name '*.tf' -print -quit)" ] || continue
            echo "::group::tflint $dir"
            tflint --config="${GITHUB_WORKSPACE}/infra/.tflint.hcl" --chdir="$dir"
            echo "::endgroup::"
          done

      - name: Trivy misconfiguration scan (blocking on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: false

  preflight:
    name: Azure preflight only — no state or deployment
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify OIDC login and subscription access
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          [ -n "${ARM_CLIENT_ID:-}" ] || fail "AZURE_CLIENT_ID is not set. Configure the repository variable with the app registration client ID."
          [ -n "${ARM_TENANT_ID:-}" ] || fail "AZURE_TENANT_ID is not set. Configure the repository variable with the tenant ID."
          [ -n "${ARM_SUBSCRIPTION_ID:-}" ] || fail "AZURE_SUBSCRIPTION_ID is not set. Configure the repository variable with the target subscription ID."

          account_json="$(az account show -o json)" || fail "OIDC login did not produce an Azure account."
          actual_subscription="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$account_json")"
          [ "$actual_subscription" = "$ARM_SUBSCRIPTION_ID" ] || fail "OIDC logged into ${actual_subscription}, but AZURE_SUBSCRIPTION_ID is ${ARM_SUBSCRIPTION_ID}."

          az account show --query "{subscriptionId:id,state:state}" -o table

      - name: Verify required resource providers
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          providers=(
            Microsoft.Authorization
            Microsoft.Compute
            Microsoft.Consumption
            Microsoft.DevTestLab
            Microsoft.Insights
            Microsoft.KeyVault
            Microsoft.Network
            Microsoft.OperationalInsights
            Microsoft.Resources
            Microsoft.Storage
          )
          for provider in "${providers[@]}"; do
            state="$(az provider show --namespace "$provider" --query registrationState -o tsv 2>/dev/null || true)"
            [ "$state" = "Registered" ] || fail "Resource provider ${provider} is ${state:-not registered}. Register it with: az provider register --namespace ${provider} --wait"
            echo "${provider}: ${state}"
          done

      - name: Verify RBAC for local facilitator deployment
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          subscription_scope="/subscriptions/${ARM_SUBSCRIPTION_ID}"
          roles_json="$(az role assignment list --assignee "$ARM_CLIENT_ID" --include-inherited --scope "$subscription_scope" --query "[].roleDefinitionName" -o json)" \
            || fail "Cannot list role assignments for the federated identity at ${subscription_scope}."
          has_role() {
            python3 -c 'import json,sys; roles=set(json.loads(sys.argv[2] or "[]")); sys.exit(0 if sys.argv[1] in roles else 1)' "$1" "$roles_json"
          }
          if ! has_role Owner && ! has_role Contributor; then
            fail "The identity needs Owner or Contributor on ${subscription_scope} to create the lab resources."
          fi
          if ! has_role Owner && ! has_role "User Access Administrator"; then
            fail "The module creates role assignments, so the identity needs Owner or User Access Administrator on ${subscription_scope}."
          fi
          echo "Required subscription RBAC assignments are present. No remote-state backend is checked because deployment uses local state."

      - name: Verify East US 2 VM quota and SKU capacity
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          vm_size="$(awk '
            $0 ~ /^variable "vm_size"/ { in_block=1 }
            in_block && $1 == "default" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' "${LAB_DIR}/variables.tf")"
          [ -n "$vm_size" ] || fail "Could not derive vm_size from ${LAB_DIR}/variables.tf."
          sku_json="$(timeout 120s az vm list-skus --location eastus2 --resource-type virtualMachines --size "$vm_size" --all --query "[?name=='${vm_size}'].{name:name,capabilities:capabilities,restrictions:restrictions}" -o json)" \
            || fail "Timed out or failed while reading SKU restrictions for ${vm_size} in eastus2."
          required_vcpus="$(python3 - "$vm_size" "$sku_json" <<'PY'
          import json, sys
          vm_size = sys.argv[1]
          skus = json.loads(sys.argv[2] or "[]")
          if not skus:
              print(f"VM SKU {vm_size} is not offered in eastus2.", file=sys.stderr)
              sys.exit(1)
          sku = skus[0]
          restrictions = sku.get("restrictions") or []
          if restrictions:
              print(f"VM SKU {vm_size} is restricted in eastus2: {json.dumps(restrictions)}", file=sys.stderr)
              sys.exit(1)
          print(next(c.get("value") for c in sku.get("capabilities", []) if c.get("name") == "vCPUs"))
          PY
          )" || fail "VM SKU ${vm_size} is not usable in eastus2."
          quota_json="$(az vm list-usage --location eastus2 --query "[?name.value=='standardDSv3Family'] | [0].{current:currentValue,limit:limit}" -o json)"
          current="$(python3 -c 'import json,sys; print(int(json.load(sys.stdin)["current"]))' <<< "$quota_json")"
          limit="$(python3 -c 'import json,sys; print(int(json.load(sys.stdin)["limit"]))' <<< "$quota_json")"
          available=$((limit - current))
          echo "VM size: ${vm_size}"
          echo "Required vCPUs: ${required_vcpus}"
          echo "standardDSv3Family quota in eastus2: used=${current}, limit=${limit}, available=${available}"
          [ "$available" -ge "$required_vcpus" ] || fail "East US 2 standardDSv3Family has ${available} available vCPUs, but ${vm_size} requires ${required_vcpus}."

  plan:
    name: Ephemeral local-state plan preview — do not apply here
    needs: preflight
    if: github.event.inputs.action == 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Materialise SSH public key
        run: |
          set -euo pipefail
          [ -n "${{ vars.LAB_SSH_PUBLIC_KEY }}" ] || { echo "::error::LAB_SSH_PUBLIC_KEY is not set."; exit 1; }
          printf '%s\n' "${{ vars.LAB_SSH_PUBLIC_KEY }}" > "${RUNNER_TEMP}/lab_key.pub"
          echo "TF_VAR_ssh_public_key_path=${RUNNER_TEMP}/lab_key.pub" >> "$GITHUB_ENV"

      - name: Terraform init with local state
        working-directory: ${{ env.LAB_DIR }}
        run: terraform init -lockfile=readonly

      - name: Terraform plan preview
        id: plan
        working-directory: ${{ env.LAB_DIR }}
        env:
          TF_VAR_owner: ${{ vars.LAB_OWNER }}
          TF_VAR_allowed_source_cidrs: ${{ vars.LAB_ALLOWED_SOURCE_CIDRS }}
        run: |
          set -euo pipefail
          terraform plan -no-color -out=tfplan -detailed-exitcode && code=$? || code=$?
          if [ "$code" -eq 1 ]; then exit 1; fi
          terraform show -no-color tfplan > plan.txt
          {
            echo "## Ephemeral plan preview only"
            echo ""
            echo "This runner uses disposable local state. Do not apply from GitHub Actions; run apply and destroy from the facilitator workstation that keeps terraform.tfstate."
            echo ""
            echo '```terraform'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
