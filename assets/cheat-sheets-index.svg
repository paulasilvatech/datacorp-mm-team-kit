<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="380" fill="#F7F7F5"/>

  <text x="60" y="40" fill="#737373" font-family="JetBrains Mono, monospace" font-size="12" font-weight="500" letter-spacing="1.9">DAY 2 · QUICK REFERENCE CARDS</text>
  <text x="60" y="76" fill="#1A1A1A" font-size="28" font-weight="500" letter-spacing="-0.4">Three One-Page Cards — Open When Unsure</text>

  <!-- 3 cards: 340 wide, gap 30, total 3*340 + 2*30 = 1080, start x=60 -->

  <g transform="translate(60, 140)">
    <rect width="340" height="220" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="1"/>
    <rect x="0" y="0" width="340" height="6" fill="#F25022"/>
    <text x="22" y="38" fill="#B33816" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="1.2">CARD 01 · COPILOT</text>
    <text x="22" y="78" fill="#1A1A1A" font-size="22" font-weight="500">Copilot's 3 Modes</text>
    <text x="22" y="120" fill="#737373" font-family="JetBrains Mono, monospace" font-size="13" font-style="italic">GUIDING QUESTION</text>
    <text x="22" y="142" fill="#1A1A1A" font-size="15">"Ask, Plan, or Agent?"</text>
    <text x="22" y="180" fill="#737373" font-size="13">Situation → mode table,</text>
    <text x="22" y="198" fill="#737373" font-size="13">examples, anti-patterns.</text>
  </g>

  <g transform="translate(430, 140)">
    <rect width="340" height="220" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="1"/>
    <rect x="0" y="0" width="340" height="6" fill="#00A4EF"/>
    <text x="22" y="38" fill="#0076AC" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="1.2">CARD 02 · SPEC-KIT</text>
    <text x="22" y="78" fill="#1A1A1A" font-size="22" font-weight="500">Spec-Kit in One Page</text>
    <text x="22" y="120" fill="#737373" font-family="JetBrains Mono, monospace" font-size="13" font-style="italic">GUIDING QUESTION</text>
    <text x="22" y="142" fill="#1A1A1A" font-size="15">"Which /speckit.* now?"</text>
    <text x="22" y="180" fill="#737373" font-size="13">specify → clarify →</text>
    <text x="22" y="198" fill="#737373" font-size="13">plan → tasks → analyze.</text>
  </g>

  <g transform="translate(800, 140)">
    <rect width="340" height="220" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="1"/>
    <rect x="0" y="0" width="340" height="6" fill="#7FBA00"/>
    <text x="22" y="38" fill="#5A8500" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="1.2">CARD 03 · ROUTING</text>
    <text x="22" y="78" fill="#1A1A1A" font-size="22" font-weight="500">Which Claude Model?</text>
    <text x="22" y="120" fill="#737373" font-family="JetBrains Mono, monospace" font-size="13" font-style="italic">GUIDING QUESTION</text>
    <text x="22" y="142" fill="#1A1A1A" font-size="15">"Haiku, Sonnet, or Opus?"</text>
    <text x="22" y="180" fill="#737373" font-size="13">Latency × accuracy ×</text>
    <text x="22" y="198" fill="#737373" font-size="13">cost matrix.</text>
  </g>
</svg>
