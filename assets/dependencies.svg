<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="480" fill="#F7F7F5"/>

  <text x="60" y="60" fill="#737373" font-family="JetBrains Mono, monospace" font-size="16" font-weight="500" letter-spacing="1.9">DAY 2 · WHO DEPENDS ON WHOM</text>
  <text x="60" y="110" fill="#1A1A1A" font-size="42" font-weight="500" letter-spacing="-0.8">Dependency Chain</text>
  <text x="60" y="148" fill="#737373" font-size="20">One persona's output feeds the next — without it, the day stalls.</text>

  <!-- 7-node horizontal chain -->
  <!-- Node width 140, gap 20, total 7*140 + 6*20 = 1100, start x = 50 -->

  <!-- Node 1: PO -->
  <g transform="translate(50, 200)">
    <rect width="140" height="180" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="1"/>
    <rect x="0" y="0" width="140" height="4" fill="#F25022"/>
    <text x="16" y="40" fill="#B33816" font-family="JetBrains Mono, monospace" font-size="10" font-weight="500" letter-spacing="1.2">PAIR 1 · VISION</text>
    <text x="16" y="78" fill="#1A1A1A" font-size="22" font-weight="500">PO</text>
    <text x="16" y="115" fill="#737373" font-size="13">Validates scope</text>
    <text x="16" y="133" fill="#737373" font-size="13">and priorities</text>
    <text x="16" y="165" fill="#737373" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="0.5">→ INPUT: BR-NNN</text>
  </g>

  <!-- Node 2: RE -->
  <g transform="translate(210, 200)">
    <rect width="140" height="180" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="1"/>
    <rect x="0" y="0" width="140" height="4" fill="#F25022"/>
    <text x="16" y="40" fill="#B33816" font-family="JetBrains Mono, monospace" font-size="10" font-weight="500" letter-spacing="1.2">PAIR 1 · VISION</text>
    <text x="16" y="78" fill="#1A1A1A" font-size="22" font-weight="500">RE</text>
    <text x="16" y="115" fill="#737373" font-size="13">Writes EARS</text>
    <text x="16" y="133" fill="#737373" font-size="13">with source_legacy</text>
    <text x="16" y="165" fill="#737373" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="0.5">→ OUTPUT: REQ-ID</text>
  </g>

  <!-- Node 3: SA -->
  <g transform="translate(370, 200)">
    <rect width="140" height="180" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="1"/>
    <rect x="0" y="0" width="140" height="4" fill="#FFB900"/>
    <text x="16" y="40" fill="#B88500" font-family="JetBrains Mono, monospace" font-size="10" font-weight="500" letter-spacing="1.2">PAIR 2 · ARCH.</text>
    <text x="16" y="78" fill="#1A1A1A" font-size="22" font-weight="500">SA</text>
    <text x="16" y="115" fill="#737373" font-size="13">Designs modules</text>
    <text x="16" y="133" fill="#737373" font-size="13">and contracts</text>
    <text x="16" y="165" fill="#737373" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="0.5">→ OUTPUT: ADR + C4</text>
  </g>

  <!-- Node 4: TL -->
  <g transform="translate(530, 200)">
    <rect width="140" height="180" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="1"/>
    <rect x="0" y="0" width="140" height="4" fill="#7FBA00"/>
    <text x="16" y="40" fill="#5A8500" font-family="JetBrains Mono, monospace" font-size="10" font-weight="500" letter-spacing="1.2">PAIR 3 · DEV.</text>
    <text x="16" y="78" fill="#1A1A1A" font-size="22" font-weight="500">TL</text>
    <text x="16" y="115" fill="#737373" font-size="13">Plans sprint</text>
    <text x="16" y="133" fill="#737373" font-size="13">and reviews PRs</text>
    <text x="16" y="165" fill="#737373" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="0.5">→ DELEGATES TO DEV</text>
  </g>

  <!-- Node 5: Dev -->
  <g transform="translate(690, 200)">
    <rect width="140" height="180" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="1"/>
    <rect x="0" y="0" width="140" height="4" fill="#7FBA00"/>
    <text x="16" y="40" fill="#5A8500" font-family="JetBrains Mono, monospace" font-size="10" font-weight="500" letter-spacing="1.2">PAIR 3 · DEV.</text>
    <text x="16" y="78" fill="#1A1A1A" font-size="22" font-weight="500">Dev</text>
    <text x="16" y="115" fill="#737373" font-size="13">Builds with</text>
    <text x="16" y="133" fill="#737373" font-size="13">Java + Next.js</text>
    <text x="16" y="165" fill="#737373" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="0.5">→ OUTPUT: CODE</text>
  </g>

  <!-- Node 6: DBA+QA group -->
  <g transform="translate(850, 200)">
    <rect width="140" height="180" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="1"/>
    <rect x="0" y="0" width="140" height="4" fill="#00A4EF"/>
    <text x="16" y="40" fill="#0076AC" font-family="JetBrains Mono, monospace" font-size="10" font-weight="500" letter-spacing="1.2">PAIR 4 · QUALITY</text>
    <text x="16" y="78" fill="#1A1A1A" font-size="22" font-weight="500">DBA · QA</text>
    <text x="16" y="115" fill="#737373" font-size="13">Migrations +</text>
    <text x="16" y="133" fill="#737373" font-size="13">BDD tests</text>
    <text x="16" y="165" fill="#737373" font-family="JetBrains Mono, monospace" font-size="10" letter-spacing="0.5">→ V1 + BDD TESTS</text>
  </g>

  <!-- Node 7: DevOps+TW group -->
  <g transform="translate(1010, 200)">
    <rect width="140" height="180" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="1"/>
    <rect x="0" y="0" width="140" height="4" fill="#1A1A1A"/>
    <text x="16" y="40" fill="#1A1A1A" font-family="JetBrains Mono, monospace" font-size="10" font-weight="500" letter-spacing="1.2">PAIR 5 · OPS</text>
    <text x="16" y="78" fill="#1A1A1A" font-size="20" font-weight="500">DevOps · TW</text>
    <text x="16" y="115" fill="#737373" font-size="13">Pipeline + IaC</text>
    <text x="16" y="133" fill="#737373" font-size="13">+ runbook</text>
    <text x="16" y="165" fill="#737373" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="0.5">→ DELIVERS: DEPLOY</text>
  </g>

  <!-- Arrows between nodes (subtle, at y=290) -->
  <g fill="none" stroke="#C8C8C0" stroke-width="1.5">
    <line x1="190" y1="290" x2="210" y2="290" marker-end="url(#arr)"/>
    <line x1="350" y1="290" x2="370" y2="290" marker-end="url(#arr)"/>
    <line x1="510" y1="290" x2="530" y2="290" marker-end="url(#arr)"/>
    <line x1="670" y1="290" x2="690" y2="290" marker-end="url(#arr)"/>
    <line x1="830" y1="290" x2="850" y2="290" marker-end="url(#arr)"/>
    <line x1="990" y1="290" x2="1010" y2="290" marker-end="url(#arr)"/>
  </g>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#737373"/>
    </marker>
  </defs>

  <!-- Footer caption -->
  <text x="60" y="438" fill="#737373" font-size="14">Each persona depends on the previous OUTPUT. If one stalls, all following personas stall.</text>
</svg>
