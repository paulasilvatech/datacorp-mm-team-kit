<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="560" fill="#F7F7F5"/>

  <text x="60" y="60" fill="#737373" font-family="JetBrains Mono, monospace" font-size="16" font-weight="500" letter-spacing="1.9">DAY 2 · STAGE HANDOFFS</text>
  <text x="60" y="110" fill="#1A1A1A" font-size="42" font-weight="500" letter-spacing="-0.8">The Three Handoffs: H1, H2, H3</text>
  <text x="60" y="148" fill="#737373" font-size="20">A 5-minute talk between outgoing and incoming pairs. Where the day flows or breaks.</text>

  <!-- 4 stage cards horizontal -->
  <!-- Card width 220, x at 60, 350, 640, 920 -->

  <!-- H1 -->
  <g transform="translate(60, 220)">
    <rect width="220" height="220" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="1"/>
    <rect x="0" y="0" width="220" height="6" fill="#F25022"/>
    <text x="20" y="44" fill="#B33816" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="1.2">STAGE 01 · ARCHAEOLOGY</text>
    <text x="20" y="78" fill="#737373" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="0.5">11:00 – 14:00</text>
    <text x="20" y="118" fill="#1A1A1A" font-size="18" font-weight="500">All 5 pairs</text>
    <text x="20" y="138" fill="#1A1A1A" font-size="18" font-weight="500">in parallel</text>
    <text x="20" y="170" fill="#737373" font-size="13">3 programs per pair.</text>
    <text x="20" y="188" fill="#737373" font-size="13">5 consolidated artifacts:</text>
    <text x="20" y="206" fill="#737373" font-size="13">glossary, BR catalog,</text>
    <text x="20" y="221" fill="#737373" font-size="11">dependency map, unknowns, report.</text>
  </g>

  <g transform="translate(350, 220)">
    <rect width="220" height="220" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="1"/>
    <rect x="0" y="0" width="220" height="6" fill="#FFB900"/>
    <text x="20" y="44" fill="#B88500" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="1.2">STAGE 02 · MODERN SPEC</text>
    <text x="20" y="78" fill="#737373" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="0.5">14:00 – 15:00</text>
    <text x="20" y="118" fill="#1A1A1A" font-size="18" font-weight="500">Pair 2 leads</text>
    <text x="20" y="138" fill="#1A1A1A" font-size="18" font-weight="500">EARS + ADRs + C4</text>
    <text x="20" y="170" fill="#737373" font-size="13">Each REQ-ID cites</text>
    <text x="20" y="188" fill="#737373" font-size="13">source_legacy or</text>
    <text x="20" y="206" fill="#737373" font-size="13">explicit [GREENFIELD].</text>
  </g>

  <g transform="translate(640, 220)">
    <rect width="220" height="220" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="1"/>
    <rect x="0" y="0" width="220" height="6" fill="#7FBA00"/>
    <text x="20" y="44" fill="#5A8500" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="1.2">STAGE 03 · BUILD</text>
    <text x="20" y="78" fill="#737373" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="0.5">15:00 – 16:10</text>
    <text x="20" y="118" fill="#1A1A1A" font-size="18" font-weight="500">Pairs 3 + 4</text>
    <text x="20" y="138" fill="#1A1A1A" font-size="18" font-weight="500">lead</text>
    <text x="20" y="170" fill="#737373" font-size="13">Each commit cites</text>
    <text x="20" y="188" fill="#737373" font-size="13">Implements REQ-XXX.</text>
    <text x="20" y="206" fill="#737373" font-size="13">Coverage ≥ 70%.</text>
  </g>

  <g transform="translate(920, 220)">
    <rect width="220" height="220" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="1"/>
    <rect x="0" y="0" width="220" height="6" fill="#1A1A1A"/>
    <text x="20" y="44" fill="#1A1A1A" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="1.2">STAGE 04 · EVOLUTION</text>
    <text x="20" y="78" fill="#737373" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="0.5">16:10 – 16:50</text>
    <text x="20" y="118" fill="#1A1A1A" font-size="18" font-weight="500">Pair 5 leads</text>
    <text x="20" y="138" fill="#1A1A1A" font-size="18" font-weight="500">Pair 3 co-leads</text>
    <text x="20" y="170" fill="#737373" font-size="13">Well-written issues →</text>
    <text x="20" y="188" fill="#737373" font-size="13">Copilot Agent opens PR →</text>
    <text x="20" y="206" fill="#737373" font-size="13">Pair 3 reviews.</text>
  </g>

  <!-- Handoff labels between cards (centered) -->
  <!-- H1 between card1 and card2: center at x=315 -->
  <g transform="translate(280, 322)">
    <line x1="0" y1="0" x2="70" y2="0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrowBlack)"/>
    <text x="35" y="-12" fill="#1A1A1A" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" letter-spacing="0.5" text-anchor="middle">H1</text>
    <text x="35" y="22" fill="#737373" font-size="11" text-anchor="middle">legacy → spec</text>
  </g>

  <g transform="translate(570, 322)">
    <line x1="0" y1="0" x2="70" y2="0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrowBlack)"/>
    <text x="35" y="-12" fill="#1A1A1A" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" letter-spacing="0.5" text-anchor="middle">H2</text>
    <text x="35" y="22" fill="#737373" font-size="11" text-anchor="middle">spec → code</text>
  </g>

  <g transform="translate(860, 322)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#1A1A1A" stroke-width="2" marker-end="url(#arrowBlack)"/>
    <text x="30" y="-12" fill="#1A1A1A" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" letter-spacing="0.5" text-anchor="middle">H3</text>
    <text x="30" y="22" fill="#737373" font-size="11" text-anchor="middle">code → ops</text>
  </g>

  <defs>
    <marker id="arrowBlack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1A1A"/>
    </marker>
  </defs>

  <!-- Bottom rule callouts -->
  <g transform="translate(60, 480)">
    <rect width="1080" height="60" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="1"/>
    <text x="20" y="28" fill="#1A1A1A" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="1.2">HANDOFF RULES</text>
    <text x="20" y="48" fill="#737373" font-size="12">5-min live talk · Receiving pair confirms what it will use · No "read later" · The next stage waits for a clear handoff.</text>
  </g>
</svg>
