    <rect x="0" y="0" width="208" height="6" fill="#7FBA00"/>
    <text x="18" y="44" fill="#5A8500" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="1.1">PAIR 3 · DELIVERY</text>
    <text x="18" y="82" fill="#1A1A1A" font-size="25" font-weight="500">Delivery</text>
