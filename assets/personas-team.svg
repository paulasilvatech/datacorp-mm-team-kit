    <text x="18" y="44" fill="#B33816" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="1.1">PAIR 1 · VISION</text>
    <text x="18" y="82" fill="#1A1A1A" font-size="25" font-weight="500">Vision</text>
    <text x="18" y="112" fill="#737373" font-size="14">Finds value and scope.</text>
    <g transform="translate(18, 150)">
      <circle cx="8" cy="8" r="6" fill="#F25022"/>
      <text x="24" y="13" fill="#1A1A1A" font-size="15">Product Owner</text>
    </g>
    <g transform="translate(18, 184)">
      <circle cx="8" cy="8" r="6" fill="#F25022"/>
      <text x="24" y="13" fill="#1A1A1A" font-size="15">Requirements Engineer</text>
    </g>
  </g>

  <g transform="translate(268, 200)">
