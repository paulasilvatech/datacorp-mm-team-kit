<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="520" fill="#F7F7F5"/>

  <text x="60" y="58" fill="#737373" font-family="JetBrains Mono, monospace" font-size="16" font-weight="500" letter-spacing="1.4">TEAM · 5 PEOPLE · 10 PERSONAS · 5 PAIRS</text>
  <text x="60" y="108" fill="#1A1A1A" font-size="42" font-weight="500">Two Personas per Person</text>
  <text x="60" y="146" fill="#737373" font-size="20">Each person covers a full SDLC pair, with no internal handoff between personas.</text>

  <g transform="translate(40, 200)">
