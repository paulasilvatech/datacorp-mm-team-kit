services:
  caddy:
    image: caddy:2.10.2-alpine
    container_name: sifap-rt-caddy
    ports: ["18080:18080"]
    volumes:
      - /Volumes/T9/Dev/oss/datacorp-mm-team-kit/infra/adabas-natural-lab/.sifap-rt-docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - /Volumes/T9/Dev/oss/datacorp-mm-team-kit/infra/adabas-natural-lab/.sifap-rt-docker/www:/srv:ro
  persist:
    image: alpine:3.20
    container_name: sifap-rt-persist
    command: sh -c 'sleep 3600'
    volumes:
      - /Volumes/T9/Dev/oss/datacorp-mm-team-kit/infra/adabas-natural-lab/.sifap-rt-docker/data/adabas-data:/data
      - /Volumes/T9/Dev/oss/datacorp-mm-team-kit/infra/adabas-natural-lab/.sifap-rt-docker/data/natural-fuser:/fuser
      - /Volumes/T9/Dev/oss/datacorp-mm-team-kit/infra/adabas-natural-lab/.sifap-rt-docker/data/state:/state
      - /Volumes/T9/Dev/oss/datacorp-mm-team-kit/infra/adabas-natural-lab/.sifap-rt-docker/data/work:/work
  app:
    image: hashicorp/http-echo:1.0
    container_name: sifap-rt-app
    profiles: ["app"]
    command: ["-listen=:8080", "-text=modern app online"]
