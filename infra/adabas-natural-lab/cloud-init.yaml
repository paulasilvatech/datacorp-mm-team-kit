#cloud-config
# ---------------------------------------------------------------------------
# SIFAP legacy lab: Adabas Community Edition + Natural Community Edition
#
# Rendered by Terraform (templatefile). The ONLY interpolations in this file are
# the template variables passed from main.tf:
#   adabas_image, natural_image, caddy_image, ttyd_image, docker_cli_image,
#   adabas_dbid, key_vault_uri, secret_name, demo_fqdn, caddy_global_options,
#   caddy_tls_directive, adabas_admin_bind,
#   basic_auth_username, basic_auth_secret_name, basic_auth_secret_kind,
#   modern_app_upstream, terminal_natural_command
# Every other dollar sign belongs to shell and is written as $VAR or $(...),
# never as $${VAR}, so Terraform's template engine cannot eat it. If you ever
# need a literal dollar-brace in shell here, you MUST escape it as $${...}
# (an unescaped one makes templatefile fail at plan time, even inside a comment).
#
# NO SECRET IS RENDERED INTO THIS FILE. custom_data is readable by every process
# on the VM through the instance metadata service, so what travels here is only
# the NAME of a Key Vault secret and how to treat it; the values are fetched at
# boot with the VM's managed identity.
#
# SIZE BUDGET: Azure caps custom_data at 65535 bytes decoded, and this file is
# ALREADY AT ~88% OF THAT once rendered (~57 KB; see "The cloud-init size
# budget" in README.md for how to measure it). Treat that as a hard constraint
# when editing: large additions belong in the checksummed SSH payload, not here.
# The corpus alone is 77 KB base64-encoded, and the seed data is another 3.5 MB.
#
# custom_data is under lifecycle { ignore_changes }, so edits to this file do
# NOT reach an already-created VM. Re-run /opt/sifap/bootstrap.sh over SSH
# instead; it is idempotent by design.
# ---------------------------------------------------------------------------

package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - gnupg
  - jq
  - lsb-release

write_files:
  # Adabas allocates System V shared memory segments. The container inherits the
  # host kernel limits, so they are raised here rather than per container.
  - path: /etc/sysctl.d/99-adabas.conf
    owner: root:root
    permissions: "0644"
    content: |
      kernel.shmmax = 1073741824
      kernel.shmall = 262144

  # Adabas Client mapping consumed by the Natural container.
  #
  # WHY THIS FILE EXISTS: the Natural CE entrypoint does NOT read any
  # ADABAS_DB_MAPPING environment variable (verified against
  # /opt/softwareag/Natural/bin/entrypoint.sh inside natural-ce:9.3.3 - it only
  # handles ACCEPT_EULA, NDVPORT and /configs). The Adabas Client library reads
  # this file instead. The image ships one hardcoded to DBIDs 11 and 12 pointing
  # at host "ADABAS-DB"; we mount our own so the DBID actually follows
  # var.adabas_dbid and the hostname matches our compose service exactly.
  - path: /opt/sifap/dbmapping.txt
    owner: root:root
    permissions: "0644"
    content: |
      # DBID = CONNECT STRING - generated by cloud-init, do not edit by hand.
      ${adabas_dbid} = adatcp://adabas-db:60001

  # The landing page served at https://<fqdn>/. It exists so the demo URL opens on
  # something that explains itself, instead of dropping an audience straight into
  # the Adabas administration console - which is what the old configuration did.
  #
  # Served by file_server from a static file rather than an inline `respond` body
  # on purpose: Caddy expands {...} placeholders in a respond body, and any real
  # HTML or CSS would be mangled by it.
  - path: /opt/sifap/www/index.html
    owner: root:root
    permissions: "0644"
    content: |
      <!doctype html><html lang="en"><meta charset="utf-8"><title>SIFAP lab</title><body style="font-family:system-ui;margin:2rem;max-width:44rem"><h1>SIFAP legacy lab</h1><p>The lab is still provisioning, or the payload download failed. Check <code>/var/log/sifap-bootstrap.log</code> and <code>/var/log/sifap-provisioning.log</code>.</p><p><a href="/terminal/">Terminal</a> · <a href="/healthz">Health</a></p><div id="status"></div><script>fetch('/status.html',{cache:'no-store'}).then(r=>r.text()).then(h=>status.innerHTML=h).catch(()=>{})</script></body></html>

  - path: /opt/sifap/www/status.html
    owner: root:root
    permissions: "0644"
    content: |
      <p>Bootstrap has not generated runtime status yet. Batch jobs run through provisioning-generated Natural drivers that assign work files under <code>/work</code>.</p>

  # Caddy reverse proxy configuration: the whole reason the demo has an https:// URL.
  #
  # It terminates TLS for the Azure-issued FQDN and fans out to four things that all live on
  # the internal container network and are never published to the host:
  #
  #   /                the landing page below, explaining the demo
  #   /terminal        ttyd -> a Natural session inside natural-ce (the green screen)
  #   /app             the modern Java + Next.js application from Stage 3 (502 until built)
  #   /admin           the Adabas REST administration console
  #   /healthz         readiness, and the ONLY route without authentication
  #
  # AUTHENTICATION. Everything except /healthz sits behind HTTP basic auth. The directive is
  # `basic_auth` - renamed from `basicauth` in Caddy 2.10, which still accepts the old spelling
  # with a deprecation warning (verified in modules/caddyhttp/caddyauth/caddyfile.go at tag
  # v2.10.2). With no algorithm argument it assumes bcrypt, and the second token in the block
  # is the bcrypt hash itself, not base64.
  #
  # Neither the username nor the hash is written here. Both arrive as environment variables
  # from /opt/sifap/caddy.env (mode 0600), which bootstrap.sh builds from Key Vault. {$VAR} is
  # Caddy's own environment placeholder, resolved when the Caddyfile is parsed.
  #
  # Which certificate it serves is decided by Terraform, not here - see
  # var.enable_public_acme:
  #   tls internal  -> Caddy's own local CA. Works behind the NSG allow-list, browser warns.
  #   (no directive) -> automatic Let's Encrypt. Needs 80/443 reachable from the internet,
  #                     because ACME HTTP-01 validation comes from arbitrary addresses.
  - path: /opt/sifap/Caddyfile
    owner: root:root
    permissions: "0644"
    content: |
      {
      	${caddy_global_options}
      	admin off
      }

      # Container-internal readiness endpoint. NOT published to the host, so it is
      # unreachable from outside the VM; it exists so the healthcheck can tell
      # "Caddy is up" apart from "the certificate is not ready yet".
      :8081 {
      	respond /healthz "ok" 200
      }

      ${demo_fqdn} {
      	${caddy_tls_directive}
      	encode gzip

      	# Public readiness probe: curl -sSf https://${demo_fqdn}/healthz
      	# Answers even while Adabas is still building the demo database, which
      	# separates "the URL is live" from "the database is ready". Deliberately
      	# outside the authenticated set so probes need no credential - it returns
      	# a fixed string and reveals nothing.
      	handle /healthz {
      		respond "ok" 200
      	}

      	# Everything else. `not path` keeps /healthz open without opening anything
      	# adjacent to it.
      	@protected not path /healthz /healthz/*
      	basic_auth @protected {
      		"{$SIFAP_BASIC_AUTH_USER}" "{$SIFAP_BASIC_AUTH_HASH}"
      	}

      	# The green screen. ttyd is told its own base path (-b /terminal) so it
      	# emits correct asset and WebSocket URLs; nothing needs stripping here,
      	# and Caddy upgrades the WebSocket transparently.
      	#
      	# The trailing-slash redirect lives INSIDE the handle block on purpose:
      	# at the top level `redir` sorts BEFORE `basic_auth` in Caddy's directive
      	# order, so it would answer unauthenticated requests. Nested here it runs
      	# after the auth check, and everything except /healthz stays protected.
      	handle /terminal* {
      		@bare path /terminal
      		redir @bare /terminal/
      		reverse_proxy ttyd:7681
      	}

      	# The modern application. Caddy tries the real Stage 3 app first and
      	# falls back to an internal static placeholder while it is absent.
      	handle /app* {
      		@bare path /app
      		redir @bare /app/
      		reverse_proxy ${modern_app_upstream} app-placeholder:8080 {
      			lb_policy first
      			health_uri /app/
      			health_interval 10s
      			health_timeout 2s
      		}
      	}

      	# The Adabas console, reachable but no longer the default route.
      	#
      	# Two blocks, not one: handle_path strips /admin BEFORE the inner matchers
      	# run, so a trailing-slash redirect nested inside it would see "/" and
      	# redirect /admin/ to itself forever. The bare path is caught first by an
      	# exact-match handle; handle blocks are mutually exclusive and evaluated in
      	# the order written, so only one of these ever fires.
      	#
      	# The prefix is stripped because the console serves its UI from its own
      	# root; if its assets turn out to use absolute URLs and the page renders
      	# half-broken, the documented fallback is an SSH tunnel straight to 8190
      	# (see admin_console_tunnel_command in outputs.tf).
      	handle /admin {
      		# The wildcard matcher is required, not decorative: `redir /admin/`
      		# alone reads its single leading-slash argument as a PATH MATCHER and
      		# fails to parse.
      		redir * /admin/
      	}
      	handle_path /admin* {
      		reverse_proxy adabas-db:8190 {
      			header_up X-Forwarded-Prefix /admin
      		}
      	}

      	# Everything not matched above: the landing page.
      	handle {
      		root * /srv
      		file_server
      	}
      }

  - path: /opt/sifap/docker-compose.yml
    owner: root:root
    permissions: "0644"
    content: |
      networks:
        sifap-lab:
          driver: bridge

      volumes:
        # Issued certificates and ACME account keys. Named volumes so a
        # `docker compose down && up` does not re-request a certificate and
        # burn Let's Encrypt rate limits.
        caddy-data:
        caddy-config:

      services:
        adabas-db:
          image: ${adabas_image}
          container_name: adabas-db
          restart: unless-stopped
          shm_size: 1gb
          environment:
            ACCEPT_EULA: "Y"
            ADABAS_DBID: "${adabas_dbid}"
            ADABAS_DB_CREATION: "demodb"
            ADABAS_ADMIN_USER: "admin"
          # ADABAS_ADMIN_PWD lives here, and only here. The file is written by
          # bootstrap.sh with mode 0600 so the credential never sits in a
          # world-readable compose file.
          env_file:
            - ./adabas.env
          ports:
            - "60001:60001"
            - "${adabas_admin_bind}"
          volumes:
            - /mnt/sifap-data/adabas-data:/data
          # The image's own healthcheck has no start_period, so it reports
          # "unhealthy" for the several minutes crdemodb needs on first boot.
          # This override makes `docker compose ps` tell the truth.
          healthcheck:
            test: ["CMD-SHELL", "sh /usr/local/bin/healthcheck.sh || exit 1"]
            interval: 15s
            timeout: 15s
            retries: 5
            start_period: 300s
          networks:
            - sifap-lab

        natural-ce:
          image: ${natural_image}
          container_name: natural-ce
          restart: unless-stopped
          environment:
            ACCEPT_EULA: "Y"
            SIFAP_WORK_BASE: "/work"
            # Natural for Linux does not read mainframe DDNAME env vars
            # (CMWKF01/CMPRINT/etc.). Batch drivers assign files at runtime
            # with DEFINE WORK FILE before FETCHing the legacy program.
          ports:
            - "2700:2700"
          volumes:
            - /mnt/sifap-data/natural-fuser:/opt/softwareag/Natural/fuser
            - /mnt/sifap-data/work:/work
            - /opt/sifap/corpus:/corpus:ro
            # Both containers share one bridge network, so Docker's embedded DNS
            # resolves "adabas-db". This mapping file is what actually points
            # Natural at the database; see /opt/sifap/dbmapping.txt above.
            - /opt/sifap/dbmapping.txt:/opt/softwareag/AdabasClient/config/dbmapping.txt:ro
          depends_on:
            # Start order only. NOT condition: service_healthy - Adabas needs
            # minutes to create the demo database on first boot and gating on
            # health here would abort the whole bootstrap.
            - adabas-db
          healthcheck:
            test: ["CMD-SHELL", "grep -q :0A8C /proc/net/tcp /proc/net/tcp6 && test -d /opt/softwareag/Natural/fuser"]
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 90s
          networks:
            - sifap-lab

        # The green screen, over HTTPS. Natural speaks a character terminal
        # protocol and its port 2700 is the Natural Development Server (the
        # protocol NaturalONE attaches to), NOT telnet - no browser can open
        # either. ttyd serves an xterm.js terminal and runs one command per
        # connection; that command opens a Natural session inside natural-ce.
        #
        # DELIBERATELY NO `ports:` BLOCK. ttyd is reachable only through Caddy,
        # which requires authentication. Publishing 7681 on the host would put an
        # interactive session one NSG edit away from the internet.
        #
        # THE TRADE-OFF, STATED PLAINLY: this container mounts the Docker socket,
        # which is root-equivalent control of the host. It is how `docker exec`
        # reaches into natural-ce, and the alternative - a second Natural
        # container sharing the FUSER volume - risks corrupting the very library
        # the workshop just compiled. What contains it: no published port, basic
        # auth at the origin, and 80/443 restricted to allowed_source_cidrs
        # unless enable_public_acme is on. Destroy the lab after the demo.
        ttyd:
          image: ${ttyd_image}
          container_name: ttyd
          restart: unless-stopped
          # The image entrypoint is tini, so this is the full argv after it.
          command:
            - ttyd
            - --port=7681
            - --base-path=/terminal
            # Without this the terminal is read-only and nobody can type.
            - --writable
            # Refuses WebSocket upgrades whose Origin does not match the Host.
            # Caddy forwards the original Host, so they match. If the terminal
            # connects and then immediately drops, drop this flag first.
            - --check-origin
            - --max-clients=10
            - --ping-interval=20
            - --terminal-type=xterm-256color
            - /usr/local/bin/sifap-session
          volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            # Alpine image, musl libc: the host's own Ubuntu (glibc) client will
            # not run here, so bootstrap.sh copies the client out of the pinned
            # Alpine-based Docker CLI image instead.
            - /opt/sifap/bin/docker:/usr/local/bin/docker:ro
            - /opt/sifap/terminal-session.sh:/usr/local/bin/sifap-session:ro
          security_opt:
            - no-new-privileges:true
          depends_on:
            - natural-ce
          healthcheck:
            test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7681/terminal/ || exit 1"]
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 30s
          networks:
            - sifap-lab

        app-placeholder:
          image: ${caddy_image}
          container_name: app-placeholder
          restart: unless-stopped
          command: ["caddy", "file-server", "--listen", ":8080", "--root", "/srv"]
          volumes:
            - /opt/sifap/www:/srv:ro
          healthcheck:
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/app/"]
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 10s
          networks:
            - sifap-lab

        # TLS termination for the public demo URL. The only container publishing
        # 80/443; everything it proxies stays on the internal bridge network.
        caddy:
          image: ${caddy_image}
          container_name: caddy
          restart: unless-stopped
          ports:
            - "80:80"
            - "443:443"
            # HTTP/3. Harmless when the NSG blocks UDP: clients fall back to TCP.
            - "443:443/udp"
          # The basic-auth username and bcrypt hash, and nothing else. Written by
          # bootstrap.sh with mode 0600 from Key Vault, so the credential never
          # sits in a world-readable compose file or in custom_data.
          env_file:
            - ./caddy.env
          volumes:
            - /opt/sifap/Caddyfile:/etc/caddy/Caddyfile:ro
            - /opt/sifap/www:/srv:ro
            - caddy-data:/data
            - caddy-config:/config
          depends_on:
            - adabas-db
            - ttyd
            - app-placeholder
          # Probes the container-internal :8081 endpoint, not the public site, so a
          # certificate that is still being issued does not read as a dead proxy.
          healthcheck:
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 60s
          networks:
            - sifap-lab

  # Runs INSIDE the ttyd container, once per browser connection. Its whole job is
  # to hand the participant a Natural session and, when it cannot, to say why in
  # words rather than dropping them at a bare prompt.
  #
  # The exact start-up line for Natural CE is the team's to determine - see
  # var.terminal_natural_command - so this tries the operator's command first,
  # then the binary where the image puts it, and finally falls back to a shell
  # with instructions. A blank black rectangle is never an acceptable outcome.
  - path: /opt/sifap/terminal-session.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/bin/sh
      # Alpine container: /bin/sh is busybox ash, not bash. Keep this POSIX.
      set -u

      CONTAINER=natural-ce

      # Quoted heredoc: the operator's command arrives verbatim, so quotes and
      # parentheses in a Natural session string cannot break this script.
      NATURAL_CMD=$(cat <<'SIFAP_NATURAL_COMMAND'
      ${terminal_natural_command}
      SIFAP_NATURAL_COMMAND
      )

      say() { printf '%s\n' "$1"; }

      if ! docker inspect -f '{{.State.Running}}' "$CONTAINER" 2>/dev/null | grep -q true; then
        say "The Natural container ($CONTAINER) is not running."
        say ""
        say "Check it from the VM with:  sudo docker compose -f /opt/sifap/docker-compose.yml ps"
        say "This window will close in 20 seconds."
        sleep 20
        exit 1
      fi

      say "Opening a Natural session in $CONTAINER ..."

      if [ -n "$NATURAL_CMD" ]; then
        exec docker exec -it "$CONTAINER" sh -lc "$NATURAL_CMD"
      fi

      # `natural` is on the PATH inside a login shell - that is exactly how
      # provisioning/lib.sh drives it in batch mode ("natural BATCHMODE ..."),
      # so this is the same entry point, minus the batch flags. Probed rather
      # than assumed: a moved binary degrades to the shell below instead of an
      # exec failure the participant cannot read.
      if docker exec "$CONTAINER" sh -lc 'command -v natural' >/dev/null 2>&1; then
        exec docker exec -it "$CONTAINER" sh -lc 'natural'
      fi

      for candidate in /opt/softwareag/Natural/bin/natural /opt/softwareag/Natural/bin/natrun; do
        if docker exec "$CONTAINER" test -x "$candidate" 2>/dev/null; then
          exec docker exec -it "$CONTAINER" "$candidate"
        fi
      done

      say ""
      say "Could not find the Natural session driver in $CONTAINER."
      say "Dropping you into a shell inside the container instead."
      say ""
      say "  ls /opt/softwareag/Natural/bin      # find the session driver"
      say "  ls /corpus                          # the SIFAP sources, read-only"
      say ""
      say "Set terminal_natural_command in terraform.tfvars once you know the"
      say "correct line, or edit /opt/sifap/terminal-session.sh on the VM and run"
      say "  sudo docker compose -f /opt/sifap/docker-compose.yml restart ttyd"
      say ""
      exec docker exec -it "$CONTAINER" /bin/bash -l

  # Installs the legacy corpus and provisioning scripts from the checksummed archive that
  # deploy-local.sh uploads over SSH. Idempotent - re-run it after any source change:
  #
  #   sudo /opt/sifap/fetch-payload.sh
  #
  - path: /opt/sifap/fetch-payload.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail

      STAGE=/opt/sifap/payload
      CORPUS=/opt/sifap/corpus
      PROVISIONING=/opt/sifap/provisioning

      rm -f /opt/sifap/PAYLOAD-FAILED
      mkdir -p "$STAGE"

      if [ ! -s "$STAGE/manifest.sha256" ]; then
        echo "############################################################"
        echo "ERROR: /opt/sifap/payload/manifest.sha256 is missing."
        echo "ERROR: the corpus and the provisioning scripts will be MISSING."
        echo "ERROR: run infra/adabas-natural-lab/deploy-local.sh from the facilitator"
        echo "ERROR: workstation; it uploads a checksummed archive over SSH, installs it"
        echo "ERROR: with this script, and then starts provisioning."
        echo "############################################################"
        date -Is > /opt/sifap/PAYLOAD-FAILED
        logger -t sifap-payload -p user.err "SIFAP-PAYLOAD RESULT: FAILED (manifest unreadable)" || true
        exit 1
      fi

      # The manifest is both the allow-list and the integrity check. Reject anything not
      # rooted under the three payload prefixes before trusting the uploaded archive.
      COUNT=0
      while read -r _hash name; do
        [ -n "$name" ] || continue
        case "$name" in
          corpus/*|provisioning/*|www/*) ;;
          *) echo "ERROR: refusing unexpected manifest entry: $name"; exit 1 ;;
        esac
        [ -f "$STAGE/$name" ] || { echo "ERROR: payload file missing: $name"; exit 1; }
        COUNT=$((COUNT + 1))
      done < "$STAGE/manifest.sha256"

      echo "verifying $COUNT uploaded files"
      ( cd "$STAGE" && sha256sum -c --quiet manifest.sha256 )
      echo "checksums OK"

      # --- install ---------------------------------------------------------
      # The corpus is bind-mounted read-only into natural-ce, which runs as uid
      # 1724, so it has to be world-readable. It is published source code, not a
      # secret.
      mkdir -p "$CORPUS"
      if [ -d "$STAGE/corpus" ]; then
        cp -a "$STAGE/corpus/." "$CORPUS/"
        chmod -R a+rX "$CORPUS"
        echo "corpus installed:"
        find "$CORPUS" -mindepth 1 -maxdepth 1 -type d -printf '  %f: ' -exec sh -c 'ls -1 "$1" | wc -l' _ {} \;
      else
        echo "WARNING: the payload carried no corpus/ prefix - Adabas will have no SIFAP data."
      fi

      if [ -d "$STAGE/www" ]; then
        mkdir -p /opt/sifap/www
        cp -a "$STAGE/www/." /opt/sifap/www/
        chmod -R a+rX /opt/sifap/www
        echo "web assets installed from payload"
      else
        echo "WARNING: the payload carried no www/ prefix - serving the inline fallback landing page."
      fi

      if [ -d "$STAGE/provisioning" ]; then
        mkdir -p "$PROVISIONING"
        cp -a "$STAGE/provisioning/." "$PROVISIONING/"
        # Executability is restored explicitly, independent of archive metadata.
        find "$PROVISIONING" \( -name '*.sh' -o -name '*.py' \) -exec chmod 0755 {} +
        echo "provisioning scripts installed: $(find "$PROVISIONING" -name '*.sh' | wc -l) shell scripts"
      else
        echo "############################################################"
        echo "WARNING: the payload carried no provisioning/ prefix."
        echo "WARNING: the corpus is on the VM but NOTHING WILL LOAD IT:"
        echo "WARNING: no Adabas file 150, no compiled SIFAPPRD library."
        echo "WARNING: infra/adabas-natural-lab/provisioning/ was empty at apply"
        echo "WARNING: time. Add the scripts, re-apply, then on the VM run:"
        echo "WARNING:   sudo /opt/sifap/fetch-payload.sh"
        echo "WARNING:   sudo systemctl restart sifap-provisioning"
        echo "############################################################"
      fi

      date -Is > /opt/sifap/PAYLOAD-OK
      logger -t sifap-payload -p user.notice "SIFAP-PAYLOAD RESULT: SUCCESS ($COUNT files)" || true
      echo "--- payload complete"

  - path: /opt/sifap/read-secret.sh
    owner: root:root
    permissions: "0700"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      [ "$EUID" -eq 0 ] || { echo "run with sudo" >&2; exit 1; }
      case "$${1:-}" in
        adabas-admin-password|demo-basic-auth-password|ddm-workstation-password) name="$1" ;;
        *) echo "unsupported secret name" >&2; exit 2 ;;
      esac
      token=$(curl -s -H "Metadata:true" \
        "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fvault.azure.net" \
        | jq -r '.access_token // empty')
      [ -n "$token" ] || { echo "managed identity token unavailable" >&2; exit 1; }
      curl -sSf -H "Authorization: Bearer $token" \
        "${key_vault_uri}secrets/$name?api-version=7.4" | jq -r '.value'

  - path: /etc/logrotate.d/sifap
    owner: root:root
    permissions: "0644"
    content: |
      /var/log/sifap-provisioning.log /mnt/sifap-data/work/logs/*.log {
        weekly
        rotate 8
        compress
        missingok
        notifempty
        copytruncate
        create 0640 root adm
      }

  - path: /etc/tmpfiles.d/sifap-work.conf
    owner: root:root
    permissions: "0644"
    content: |
      d /mnt/sifap-data/work 0750 1724 1724 -
      d /mnt/sifap-data/work/in 0750 1724 1724 -
      d /mnt/sifap-data/work/runs 0750 1724 1724 -
      d /mnt/sifap-data/work/logs 0750 1724 1724 -
      d /mnt/sifap-data/work/reports 0750 1724 1724 -
      e /mnt/sifap-data/work/runs 0750 1724 1724 180d
      e /mnt/sifap-data/work/logs 0750 1724 1724 30d

  - path: /opt/sifap/update-www-status.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      phase=auto
      [ -r /etc/sifap/provisioning.env ] && . /etc/sifap/provisioning.env || true
      ddms="pending"; [ -f /opt/sifap/state/DDMS-READY ] && ddms="ready"
      final="pending"; [ -f /opt/sifap/PROVISIONED ] && final="complete"
      payload="ok"; [ -f /opt/sifap/PAYLOAD-FAILED ] && payload="failed"
      cat > /opt/sifap/www/status.html <<EOF
      <ul><li>Requested phase: <code>$${SIFAP_PHASE:-$phase}</code></li><li>Payload: <code>$payload</code></li><li>DDMs: <code>$ddms</code></li><li>Final provisioning: <code>$final</code></li><li>Terminal: <a href="/terminal/">/terminal/</a></li></ul>
      EOF

  - path: /etc/sifap/provisioning.env
    owner: root:root
    permissions: "0644"
    content: |
      # Persistent copy is moved to /mnt/sifap-data/state/provisioning.env.
      SIFAP_PHASE=auto

  # Systemd wrapper around provisioning/run-all.sh.
  - path: /opt/sifap/run-provisioning.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail

      LOG=/var/log/sifap-provisioning.log
      # Append, never truncate, and never world-readable - same treatment as the
      # bootstrap log.
      touch "$LOG"
      chown root:adm "$LOG" 2>/dev/null || true
      chmod 0640 "$LOG"
      # fd 3 keeps a handle on the journal BEFORE the tee is installed. run-all.sh
      # tees to this same file itself, so it is handed fd 3 instead of the tee -
      # otherwise every line it prints would be written to the log twice.
      exec 3>&1
      exec > >(tee -a "$LOG") 2>&1

      ENTRYPOINT=/opt/sifap/provisioning/run-all.sh
      STATE_DIR=/opt/sifap/state
      FUSER=/mnt/sifap-data/natural-fuser
      DDM_BACKUP=/mnt/sifap-data/state/ddm-gp-backup.tgz
      DDM_MEMBERS=(BENEFIC SOCPROG PAYMENT AUDIT)
      SIFAP_PHASE="$${SIFAP_PHASE:-auto}"

      rm -f /opt/sifap/PROVISIONING-FAILED

      ddms_present() {
        local member
        for member in "$${DDM_MEMBERS[@]}"; do
          find "$FUSER" -path "*/GP/$member.NGD" -type f -print -quit 2>/dev/null | grep -q . \
            || return 1
        done
      }

      restore_ddm_backup_if_empty() {
        mkdir -p "$FUSER" "$STATE_DIR"
        if ddms_present; then
          echo "Natural DDMs already present in FUSER; restore not needed"
          return 0
        fi
        if [ -s "$DDM_BACKUP" ]; then
          echo "restoring Natural DDM GP backup into persistent FUSER"
          tar -xzf "$DDM_BACKUP" -C "$FUSER"
          chown -R 1724:1724 "$FUSER"
          ddms_present || { echo "DDM backup is incomplete"; rm -f "$STATE_DIR/DDMS-READY"; return 1; }
          date -Is > "$STATE_DIR/DDMS-READY"
        else
          echo "no DDM backup available yet; a fresh lab needs the NaturalONE DDM step"
          rm -f "$STATE_DIR/DDMS-READY"
        fi
      }

      backup_ddms_if_present() {
        local member found
        local files=()
        mkdir -p "$STATE_DIR"
        for member in "$${DDM_MEMBERS[@]}"; do
          found=$(find "$FUSER" -path "*/GP/$member.NGD" -type f -print -quit 2>/dev/null || true)
          if [ -z "$found" ]; then
            echo "DDM $member is not present; backup remains pending"
            rm -f "$STATE_DIR/DDMS-READY" "$DDM_BACKUP"
            return 0
          fi
          files+=("$${found#"$FUSER"/}")
        done
        tmp="$STATE_DIR/ddm-gp-backup.new.tgz"
        ( cd "$FUSER" && printf '%s\0' "$${files[@]}" | tar --null -czf "$tmp" --files-from - )
        mv "$tmp" "$DDM_BACKUP"
        chown 1724:1724 "$DDM_BACKUP"
        date -Is > "$STATE_DIR/DDMS-READY"
        echo "DDM backup persisted on the managed data disk: $DDM_BACKUP"
      }

      on_exit() {
        rc=$?
        if [ "$rc" -eq 0 ]; then
          echo "PROVISIONING RESULT: SUCCESS"
          logger -t sifap-provisioning -p user.notice "SIFAP-PROVISIONING RESULT: SUCCESS" || true
          if [ -f /opt/sifap/PROVISIONED ]; then
            echo "finalize marker present: /opt/sifap/PROVISIONED"
          else
            echo "base phase completed without finalization; DDMs are still pending"
          fi
        else
          echo "PROVISIONING RESULT: FAILED (exit $rc at line $PROV_LINE)"
          logger -t sifap-provisioning -p user.err "SIFAP-PROVISIONING RESULT: FAILED (exit $rc at line $PROV_LINE)" || true
          printf 'failed at %s (exit %s, line %s)\n' "$(date -Is)" "$rc" "$PROV_LINE" \
            > /opt/sifap/PROVISIONING-FAILED
        fi
        /opt/sifap/update-www-status.sh || true
      }
      PROV_LINE=0
      trap 'PROV_LINE=$LINENO' ERR
      trap on_exit EXIT

      echo "=== SIFAP provisioning started at $(date -Is) ==="
      echo "phase: $SIFAP_PHASE"
      restore_ddm_backup_if_empty

      if [ ! -f "$ENTRYPOINT" ]; then
        echo "ERROR: $ENTRYPOINT is missing."
        echo "ERROR: nothing has loaded Adabas and nothing has compiled Natural."
        echo "ERROR: the corpus itself may still be present - check /opt/sifap/corpus."
        echo "ERROR:"
        echo "ERROR: fix: add the scripts under infra/adabas-natural-lab/provisioning/"
        echo "ERROR:      (run-all.sh, 01-load-adabas.sh, 02-build-natural.sh,"
        echo "ERROR:       03-smoke-test.sh, lib.sh, seed/), re-apply, then on the VM:"
        echo "ERROR:        sudo /opt/sifap/fetch-payload.sh"
        echo "ERROR:        sudo systemctl restart sifap-provisioning"
        exit 3
      fi

      chmod 0755 "$ENTRYPOINT" 2>/dev/null || true

      echo "waiting for the adabas-db container to be running (up to 5 minutes)"
      READY=0
      for attempt in $(seq 1 60); do
        if [ "$(docker inspect -f '{{.State.Running}}' adabas-db 2>/dev/null || echo false)" = "true" ]; then
          READY=1
          echo "adabas-db is running after $((attempt * 5))s"
          break
        fi
        sleep 5
      done
      if [ "$READY" -ne 1 ]; then
        echo "ERROR: the adabas-db container is not running, so there is nothing"
        echo "ERROR: to load into. This is a container problem, not a load problem."
        echo "ERROR: check: sudo docker compose -f /opt/sifap/docker-compose.yml logs adabas-db"
        exit 4
      fi

      export PROVISIONING_DIR=/opt/sifap/provisioning
      export SIFAP_CORPUS_DIR=/opt/sifap/corpus
      export SIFAP_PROVISIONING_LOG=/var/log/sifap-provisioning.log
      export ADABAS_CONTAINER=adabas-db
      export NATURAL_CONTAINER=natural-ce
      export ADABAS_DBID="${adabas_dbid}"
      export HOST_ADABAS_ENV=/opt/sifap/adabas.env
      export SIFAP_PHASE
      export SIFAP_STATE_DIR="$STATE_DIR"
      export SIFAP_DDMS_READY_MARKER="$STATE_DIR/DDMS-READY"

      cd /opt/sifap/provisioning
      "$ENTRYPOINT" >&3 2>&3

      backup_ddms_if_present

      echo "=== SIFAP provisioning finished at $(date -Is) ==="

  # Long-running provisioning unit.
  - path: /etc/systemd/system/sifap-provisioning.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=SIFAP legacy provisioning (Adabas load + Natural compile)
      Documentation=file:/var/log/sifap-provisioning.log
      After=docker.service network-online.target mnt-sifap\x2ddata.mount
      Requires=docker.service
      RequiresMountsFor=/mnt/sifap-data

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      EnvironmentFile=-/etc/sifap/provisioning.env
      # Long enough for a slow first ADALOD plus a full CATALL. The default 90s
      # would kill the load mid-flight and leave a half-populated file.
      TimeoutStartSec=3600
      ExecStart=/opt/sifap/run-provisioning.sh

      [Install]
      WantedBy=multi-user.target

  - path: /opt/sifap/install-docker.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Docker from the official repository; the Ubuntu archive build lags behind.
      # Split out of runcmd so every network call can retry: first-boot DNS and
      # egress on a fresh Azure VM are routinely flaky for the first few seconds.
      set -euo pipefail

      if command -v docker >/dev/null 2>&1; then
        echo "docker already installed; skipping repository setup"
      else
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL --retry 5 --retry-delay 3 --retry-connrefused \
          https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc

        # Derive the codename instead of hardcoding "jammy", so the file keeps
        # working if source_image_reference is ever moved to a newer Ubuntu LTS.
        CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")
        echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $CODENAME stable" \
          > /etc/apt/sources.list.d/docker.list

        for attempt in $(seq 1 5); do
          apt-get update && break
          echo "apt-get update failed (attempt $attempt/5); retrying"
          sleep 10
        done

        for attempt in $(seq 1 5); do
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin && break
          echo "docker install failed (attempt $attempt/5); retrying"
          sleep 10
        done
      fi

      systemctl enable docker

      # Every human who can sudo on this box should be able to drive docker.
      # Derived from the sudo group rather than hardcoding the admin username,
      # which is a Terraform variable and not passed into this template.
      for u in $(getent group sudo | cut -d: -f4 | tr ',' ' '); do
        [ -n "$u" ] && usermod -aG docker "$u" || true
      done

      echo "docker install step finished"

  - path: /opt/sifap/bootstrap.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Idempotent: safe to re-run over SSH after fixing whatever went wrong.
      #   sudo /opt/sifap/bootstrap.sh
      set -Eeuo pipefail

      LOG=/var/log/sifap-bootstrap.log
      # Append, never truncate, so a re-run keeps the earlier evidence. Created
      # before the redirect so tee cannot leave it world-readable at 0644.
      touch "$LOG"
      chown root:adm "$LOG" 2>/dev/null || true
      chmod 0640 "$LOG"
      exec > >(tee -a "$LOG") 2>&1

      rm -f /opt/sifap/READY /opt/sifap/FAILED

      # Single, unambiguous success/failure marker for a human over SSH.
      # outputs.tf points at $LOG; these markers are the machine-readable half.
      #
      # The `logger` calls put the same marker on syslog, which the Azure Monitor
      # agent ships to Log Analytics. That is what
      # azurerm_monitor_scheduled_query_rules_alert_v2.bootstrap_failed queries,
      # so a first boot that dies at 02:00 raises an alert instead of waiting for
      # someone to SSH in and notice. Keep the string in sync with the KQL in main.tf.
      on_exit() {
        rc=$?
        if [ "$rc" -eq 0 ]; then
          echo "BOOTSTRAP RESULT: SUCCESS"
          logger -t sifap-bootstrap -p user.notice "SIFAP-BOOTSTRAP RESULT: SUCCESS" || true
          date -Is > /opt/sifap/READY
        else
          echo "BOOTSTRAP RESULT: FAILED (exit $rc at line $BOOTSTRAP_LINE)"
          logger -t sifap-bootstrap -p user.err "SIFAP-BOOTSTRAP RESULT: FAILED (exit $rc at line $BOOTSTRAP_LINE)" || true
          echo "Inspect $LOG, fix the cause, then re-run: sudo /opt/sifap/bootstrap.sh"
          printf 'failed at %s (exit %s, line %s)\n' "$(date -Is)" "$rc" "$BOOTSTRAP_LINE" \
            > /opt/sifap/FAILED
        fi
      }
      BOOTSTRAP_LINE=0
      trap 'BOOTSTRAP_LINE=$LINENO' ERR
      trap on_exit EXIT

      echo "=== SIFAP lab bootstrap started at $(date -Is) ==="

      # --- data disk -------------------------------------------------------
      # Azure exposes data disks under stable LUN aliases. New VM generations use
      # data/by-lun (NVMe); older generations use scsi1/lun.
      # This whole block runs BEFORE Docker starts any container, so nothing can
      # write Adabas or Natural FUSER data to the OS disk and then have it
      # shadowed by the mount.
      DISK=""
      for _ in $(seq 1 60); do
        for candidate in /dev/disk/azure/data/by-lun/0 /dev/disk/azure/scsi1/lun0; do
          if [ -b "$candidate" ]; then
            DISK="$candidate"
            break 2
          fi
        done
        echo "waiting for Azure data disk LUN 0 ..."
        sleep 5
      done

      if [ -n "$DISK" ]; then
        if ! blkid "$DISK" >/dev/null 2>&1; then
          echo "formatting empty data disk"
          mkfs.ext4 -F -L sifapdata "$DISK"
        else
          echo "data disk already carries a filesystem; leaving it alone"
        fi

        mkdir -p /mnt/sifap-data

        # UUID, not LABEL and never /dev/sdX: it is the only identifier that is
        # both stable across reattach and unique across disks.
        DISK_UUID=$(blkid -s UUID -o value "$DISK")
        if [ -z "$DISK_UUID" ]; then
          echo "ERROR: could not read filesystem UUID from $DISK"
          exit 1
        fi

        # nofail keeps a missing disk from wedging boot at the emergency prompt;
        # x-systemd.device-timeout stops systemd waiting 90s for it.
        FSTAB_LINE="UUID=$DISK_UUID /mnt/sifap-data ext4 defaults,nofail,x-systemd.device-timeout=30s 0 2"
        # Literal space, not [[:space:]]: "$DISK_UUID[" reads as an array
        # subscript to both bash and shellcheck, and the obvious repair
        # ($${DISK_UUID}) would need Terraform escaping to survive templatefile.
        if ! grep -q "^UUID=$DISK_UUID /mnt/sifap-data " /etc/fstab; then
          # Drop any earlier entry for this mount point (e.g. a LABEL= line from
          # a previous bootstrap) so re-runs cannot stack duplicates.
          sed -i '\| /mnt/adabas-data |d; \| /mnt/sifap-data |d' /etc/fstab
          echo "$FSTAB_LINE" >> /etc/fstab
          echo "added fstab entry: $FSTAB_LINE"
        fi

        # daemon-reload BEFORE mounting so systemd regenerates the .mount unit
        # from the fstab line we just wrote.
        systemctl daemon-reload || true
        mountpoint -q /mnt/sifap-data || mount /mnt/sifap-data

        if ! mountpoint -q /mnt/sifap-data; then
          echo "ERROR: /mnt/sifap-data did not mount"
          exit 1
        fi
        echo "data disk mounted:"
        df -h /mnt/sifap-data
      else
        echo "ERROR: data disk never appeared at $DISK."
        echo "ERROR: refusing to fall back to the OS disk because Natural DDMs"
        echo "ERROR: and Adabas data must survive OS disk rebuilds."
        echo "ERROR: check the LUN 0 attachment with:"
        echo "ERROR:   az vm show -d -g <rg> -n <vm> -o json"
        exit 1
      fi

      mkdir -p /mnt/sifap-data/adabas-data /mnt/sifap-data/natural-fuser /mnt/sifap-data/state /mnt/sifap-data/work/{in,runs,logs,reports} /opt/sifap/corpus /etc/sifap
      chown -R 1724:1724 /mnt/sifap-data/adabas-data /mnt/sifap-data/natural-fuser /mnt/sifap-data/work
      chmod 0750 /mnt/sifap-data /mnt/sifap-data/adabas-data /mnt/sifap-data/natural-fuser /mnt/sifap-data/work /mnt/sifap-data/work/{in,runs,logs,reports}
      chmod 0755 /mnt/sifap-data/state

      if [ -d /opt/sifap/state ] && [ ! -L /opt/sifap/state ]; then
        cp -a /opt/sifap/state/. /mnt/sifap-data/state/ 2>/dev/null || true
        rm -rf /opt/sifap/state
      fi
      ln -sfn /mnt/sifap-data/state /opt/sifap/state

      if [ ! -f /mnt/sifap-data/state/provisioning.env ]; then
        if [ -f /etc/sifap/provisioning.env ] && [ ! -L /etc/sifap/provisioning.env ]; then
          cp /etc/sifap/provisioning.env /mnt/sifap-data/state/provisioning.env
        else
          printf 'SIFAP_PHASE=auto\n' > /mnt/sifap-data/state/provisioning.env
        fi
      fi
      ln -sfn /mnt/sifap-data/state/provisioning.env /etc/sifap/provisioning.env
      chown root:root /mnt/sifap-data/state/provisioning.env
      chmod 0644 /mnt/sifap-data/state/provisioning.env

      mkdir -p /etc/systemd/system/docker.service.d
      cat > /etc/systemd/system/docker.service.d/10-sifap-data.conf <<'EOF'
      [Unit]
      RequiresMountsFor=/mnt/sifap-data
      After=mnt-sifap\x2ddata.mount
      EOF
      systemctl daemon-reload || true

      # Both images run as the non-root service account sagadmin, uid/gid 1724
      # (verified in /etc/passwd of adabas-ce and natural-ce). The Adabas
      # entrypoint hard-fails with exit 20 if /data is not writable, so grant
      # exactly that account write access instead of chmod 777.
      chown -R 1724:1724 /mnt/sifap-data/adabas-data /mnt/sifap-data/natural-fuser /mnt/sifap-data/work
      systemd-tmpfiles --create /etc/tmpfiles.d/sifap-work.conf || true
      /opt/sifap/update-www-status.sh || true

      sysctl --system

      # --- key vault helper ------------------------------------------------
      # The protected VM extension seeds the private-only vault. Wait for its marker before
      # reading so cloud-init cannot race private DNS or access-policy propagation.
      for attempt in $(seq 1 120); do
        [ -f /opt/sifap/SECRETS-READY ] && break
        echo "waiting for Key Vault seed extension (attempt $attempt/120)"
        sleep 5
      done
      if [ ! -f /opt/sifap/SECRETS-READY ]; then
        echo "ERROR: protected Key Vault seed extension did not complete within 10 minutes"
        exit 1
      fi
      #
      # Writes the secret to stdout and NOTHING else; every diagnostic goes to
      # stderr, so callers can safely do VALUE=$(read_kv_secret name 30).
      read_kv_secret() {
        local name="$1" attempts="$2" token="" value=""
        for attempt in $(seq 1 "$attempts"); do
          # -s keeps the token off stdout; nothing here is ever echoed.
          token=$(curl -s --retry 3 --retry-delay 2 -H "Metadata:true" \
            "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fvault.azure.net" \
            | jq -r '.access_token // empty')

          if [ -n "$token" ]; then
            value=$(curl -s -H "Authorization: Bearer $token" \
              "${key_vault_uri}secrets/$name?api-version=7.4" | jq -r '.value // empty')
          fi

          if [ -n "$value" ]; then
            echo "key vault: read '$name' on attempt $attempt" >&2
            printf '%s' "$value"
            return 0
          fi
          echo "key vault: '$name' not readable yet (attempt $attempt/$attempts); retrying" >&2
          sleep 10
        done
        return 1
      }

      # --- adabas admin password from key vault ----------------------------
      ADMIN_PWD=$(read_kv_secret "${secret_name}" 30 || true)

      if [ -z "$ADMIN_PWD" ]; then
        echo "ERROR: adabas-admin-password is unreadable from the private Key Vault"
        exit 1
      fi

      # The Adabas entrypoint accepts an already-hashed value (it calls
      # check_if_valid_hash and reuses a 128-char SHA-512 digest verbatim), so
      # the plaintext password never has to reach disk on this VM.
      ADMIN_HASH=$(printf '%s' "$ADMIN_PWD" | sha512sum | cut -d' ' -f1)

      # Rewritten from scratch on every run: idempotent, unlike sed-ing a
      # placeholder that only exists the first time. umask 077 before the
      # redirect so the digest is never briefly world-readable.
      ( umask 077; printf 'ADABAS_ADMIN_PWD=%s\n' "$ADMIN_HASH" > /opt/sifap/adabas.env )
      chown root:root /opt/sifap/adabas.env
      chmod 0600 /opt/sifap/adabas.env

      unset ADMIN_PWD ADMIN_HASH

      # --- legacy corpus and provisioning scripts --------------------------
      # deploy-local.sh uploads both after cloud-init finishes; this early call intentionally
      # leaves a clear PAYLOAD-FAILED marker until that happens. The facilitator script then
      # verifies the archive, installs it, clears the marker and restarts provisioning.
      #
      # Not fatal: Docker and the secure origin must come up before SSH delivery can run.
      if ! /opt/sifap/fetch-payload.sh; then
        echo "WARNING: payload has not been uploaded yet - see the block above."
        echo "WARNING: the lab will start, but with NO SIFAP data and NO"
        echo "WARNING: provisioning scripts until deploy-local.sh completes."
      fi

      # --- containers ------------------------------------------------------
      # Docker is enabled by install-docker.sh but started only after the data
      # disk is mounted and the RequiresMountsFor drop-in is installed. That
      # prevents restart policies from ever creating an empty FUSER on the OS
      # disk.
      systemctl start docker
      for attempt in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        echo "waiting for the docker daemon (attempt $attempt/30)"
        sleep 5
      done
      if ! docker info >/dev/null 2>&1; then
        echo "ERROR: docker daemon never became ready"
        exit 1
      fi
      echo "docker daemon is ready"

      cd /opt/sifap

      # ~1.7 GB across both images. Retried: a single transient registry error
      # would otherwise kill the whole bootstrap under set -e.
      echo "pulling images (~1.7 GB, this is the slow step)"
      PULLED=0
      for attempt in $(seq 1 5); do
        if docker compose pull; then PULLED=1; break; fi
        echo "image pull failed (attempt $attempt/5); retrying in 15s"
        sleep 15
      done
      if [ "$PULLED" -ne 1 ]; then
        echo "ERROR: could not pull the Adabas/Natural images."
        echo "ERROR: both are public on Docker Hub and need no login; this is"
        echo "ERROR: almost certainly egress or DNS on the VM. Check with:"
        echo "ERROR:   docker pull ${adabas_image}"
        exit 1
      fi

      if ! find /mnt/sifap-data/natural-fuser -mindepth 1 -print -quit | grep -q .; then
        echo "seeding persistent Natural FUSER from the image"
        docker run --rm -e ACCEPT_EULA=Y --entrypoint sh \
          -v /mnt/sifap-data/natural-fuser:/target "${natural_image}" \
          -lc 'cp -a /opt/softwareag/Natural/fuser/. /target/'
        chown -R 1724:1724 /mnt/sifap-data/natural-fuser
      fi

      # --- docker client for the web terminal -------------------------------
      # ttyd runs `docker exec` into natural-ce, and its image is Alpine (musl),
      # so the host's Ubuntu client cannot simply be bind-mounted - it is glibc
      # and would fail to load. The client binary is lifted out of the pinned
      # Alpine-based Docker CLI image instead, which is why docker_cli_image
      # exists as a variable at all.
      #
      # This MUST happen before `compose up`: Docker creates a DIRECTORY at a
      # bind-mount source that does not exist, and a directory mounted over
      # /usr/local/bin/docker makes ttyd fail in a thoroughly confusing way.
      mkdir -p /opt/sifap/bin
      if [ ! -x /opt/sifap/bin/docker ]; then
        echo "extracting the docker client from ${docker_cli_image}"
        docker pull "${docker_cli_image}"
        CLI_CID=$(docker create "${docker_cli_image}")
        docker cp "$CLI_CID:/usr/local/bin/docker" /opt/sifap/bin/docker
        docker rm -v "$CLI_CID" >/dev/null
        chmod 0755 /opt/sifap/bin/docker
        echo "docker client staged: $(/opt/sifap/bin/docker --version 2>/dev/null || echo 'version check failed')"
      else
        echo "docker client already staged at /opt/sifap/bin/docker"
      fi

      # --- basic auth for the public origin ---------------------------------
      # Caddy reads the username and the bcrypt hash from this env file, so the
      # credential lives in exactly one place on the VM, at mode 0600, and never
      # in custom_data, the compose file or the Caddyfile.
      #
      # Two shapes are supported, decided by Terraform:
      #   hash      - the operator supplied their own bcrypt hash; use verbatim.
      #   password  - Terraform generated a random password and stored the
      #               PLAINTEXT in Key Vault (so a human can be told it); this
      #               hashes it here. `caddy hash-password` reads stdin when
      #               stdin is not a TTY, which keeps the plaintext out of the
      #               process table and out of `docker inspect`.
      BASIC_AUTH_SECRET=$(read_kv_secret "${basic_auth_secret_name}" 30 || true)
      # Rendered by Terraform to a literal "password" or "hash". Held in a
      # variable rather than compared inline so the branch reads as a decision
      # rather than as a constant.
      BASIC_AUTH_KIND="${basic_auth_secret_kind}"
      BASIC_AUTH_HASH=""

      if [ -n "$BASIC_AUTH_SECRET" ]; then
        if [ "$BASIC_AUTH_KIND" = "hash" ]; then
          BASIC_AUTH_HASH="$BASIC_AUTH_SECRET"
        else
          # Piped, never passed as an argument. Trailing newline is required:
          # hash-password reads one line from a non-interactive stdin.
          BASIC_AUTH_HASH=$(printf '%s\n' "$BASIC_AUTH_SECRET" \
            | docker run --rm -i "${caddy_image}" caddy hash-password 2>/dev/null | tr -d '\r\n')
        fi
      fi

      if [ -z "$BASIC_AUTH_HASH" ]; then
        # FAIL CLOSED. An unreadable credential must never degrade into an open
        # origin, so the site gets a hash of a random string nobody holds: the
        # URL stays up, /healthz still answers, and every other route is simply
        # unenterable until this is fixed.
        echo "############################################################"
        echo "WARNING: could not build the basic-auth hash for the demo URL."
        echo "WARNING: the site is being locked with an UNKNOWN password."
        echo "WARNING: nobody can sign in until this is repaired - which is the"
        echo "WARNING: intended failure mode; an open origin is not."
        echo "WARNING: fix: confirm the VM identity has Get on the vault and"
        echo "WARNING: that the '${basic_auth_secret_name}' secret exists, then"
        echo "WARNING: re-run  sudo /opt/sifap/bootstrap.sh"
        echo "############################################################"
        BASIC_AUTH_HASH=$(head -c 32 /dev/urandom | base64 \
          | docker run --rm -i "${caddy_image}" caddy hash-password 2>/dev/null | tr -d '\r\n')
      fi

      # Written whole on every run, umask first so it is never briefly readable.
      # The hash is a verifier, not a password, but it is still bcrypt-crackable
      # offline and gets the same 0600 treatment as adabas.env.
      COMPOSE_BASIC_AUTH_HASH=$(printf '%s' "$BASIC_AUTH_HASH" | sed 's/\$/$$/g')
      ( umask 077
        printf 'SIFAP_BASIC_AUTH_USER=%s\n' '${basic_auth_username}' > /opt/sifap/caddy.env
        printf 'SIFAP_BASIC_AUTH_HASH=%s\n' "$COMPOSE_BASIC_AUTH_HASH" >> /opt/sifap/caddy.env )
      chown root:root /opt/sifap/caddy.env
      chmod 0600 /opt/sifap/caddy.env
      echo "basic auth configured for user '${basic_auth_username}' (hash not logged)"

      unset BASIC_AUTH_SECRET BASIC_AUTH_HASH BASIC_AUTH_KIND COMPOSE_BASIC_AUTH_HASH

      docker compose up -d --remove-orphans
      /opt/sifap/update-www-status.sh || true

      # Bounded readiness probe. Deliberately NOT fatal: Adabas can take several
      # minutes to build the demo database and we do not want a slow disk to be
      # reported as a broken lab. It only makes the log honest.
      echo "waiting for the Adabas nucleus to answer (up to 10 minutes)"
      for attempt in $(seq 1 60); do
        state=$(docker inspect -f '{{.State.Health.Status}}' adabas-db 2>/dev/null || echo unknown)
        if [ "$state" = "healthy" ]; then
          echo "adabas-db is healthy after $((attempt * 10))s"
          break
        fi
        sleep 10
      done

      echo "--- container state ---"
      docker compose ps
      echo "-----------------------"

      # --- provisioning ------------------------------------------------------
      # Hand off to systemd rather than running it here. run-all.sh loads Adabas
      # and compiles the whole SIFAPPRD library, which takes far longer than
      # cloud-init should be kept waiting; --no-block lets bootstrap.sh finish
      # and report while the load continues in the background.
      systemctl daemon-reload
      systemctl enable sifap-provisioning.service >/dev/null 2>&1 || true
      if [ -f /opt/sifap/provisioning/run-all.sh ]; then
        echo "starting sifap-provisioning (Adabas load + Natural compile, runs in background)"
      else
        echo "WARNING: /opt/sifap/provisioning/run-all.sh is absent; the unit will"
        echo "WARNING: start, fail immediately and say exactly why. That is"
        echo "WARNING: deliberate - a silent no-op is how a demo reaches the room"
        echo "WARNING: with an empty database."
      fi
      systemctl restart --no-block sifap-provisioning.service || true

      # --- demo url --------------------------------------------------------
      DEMO_FQDN="${demo_fqdn}"
      # Bounded and NOT fatal, same reasoning as the Adabas probe above. With
      # Caddy's internal CA the certificate is ready in seconds; with Let's
      # Encrypt it waits on an ACME round trip that can take a minute.
      echo "checking the demo URL: https://$DEMO_FQDN/healthz"
      DEMO_OK=0
      for attempt in $(seq 1 20); do
        # -k because the internal-CA certificate is not in the VM's trust store.
        # This only proves the proxy is answering over TLS, not that the chain is
        # publicly trusted - a browser is the judge of that.
           if curl -sSk --max-time 10 --resolve "$DEMO_FQDN:443:127.0.0.1" \
             -o /dev/null "https://$DEMO_FQDN/healthz"; then
          DEMO_OK=1
          echo "demo URL answered after $((attempt * 10))s"
          break
        fi
        sleep 10
      done
      if [ "$DEMO_OK" -ne 1 ]; then
        echo "WARNING: https://$DEMO_FQDN/healthz did not answer yet."
        echo "WARNING: check 'docker compose logs caddy'. If it is failing ACME,"
        echo "WARNING: Let's Encrypt cannot reach port 80 from the internet -"
        echo "WARNING: that needs enable_public_acme = true in terraform.tfvars."
      fi

      echo ""
      echo "  Demo URL      https://$DEMO_FQDN/           landing page"
      echo "  Green screen  https://$DEMO_FQDN/terminal/  Natural session"
      echo "  Modern app    https://$DEMO_FQDN/app/       placeholder until Stage 3 ships"
      echo "  Adabas admin  https://$DEMO_FQDN/admin/     console"
      echo "  Readiness     https://$DEMO_FQDN/healthz    no authentication"
      echo ""
      echo "  Sign in as '${basic_auth_username}'. The password is in Key Vault -"
      echo "  see the basic_auth_password_command output; it is never printed here."
      echo ""
      echo "  Legacy sources: /opt/sifap/corpus (read-only as /corpus in natural-ce)"
      echo "  Provisioning:   systemctl status sifap-provisioning"
      echo "                  tail -f /var/log/sifap-provisioning.log"
      echo "=== SIFAP lab bootstrap finished at $(date -Is) ==="

runcmd:
  - /opt/sifap/install-docker.sh
  - /opt/sifap/bootstrap.sh

final_message: "SIFAP legacy lab ready after $UPTIME seconds"
